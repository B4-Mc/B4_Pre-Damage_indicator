plugins {
    id 'fabric-loom' version '1.14-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    runs {
        configureEach {
            runDir "run/${project.minecraft_version}"
        }
    }

    mods {
        "b4_pre-damage_indicator" {
            sourceSet sourceSets.main
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = false
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://pkgs.dev.azure.com/isxander-dev/yet-another-config-lib/_maven/v2" }
    mavenCentral()
}

def generatedMixinSourceDir = layout.buildDirectory.dir("generated/sources/predamageMixin/java")
sourceSets.main.java.srcDir(generatedMixinSourceDir)

tasks.register("generateLivingEntityAccessor") {
    def outputFile = generatedMixinSourceDir.map {
        it.file("com/b4/predamage/mixin/LivingEntityAccessor.java")
    }

    inputs.property("minecraftVersion", project.minecraft_version)
    outputs.file(outputFile)

    doLast {
        def file = outputFile.get().asFile
        file.parentFile.mkdirs()
        file.text = """package com.b4.predamage.mixin;

import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.gen.Accessor;

import java.util.List;
import net.minecraft.entity.LivingEntity;
import net.minecraft.entity.data.TrackedData;
import net.minecraft.particle.ParticleEffect;

@Mixin(LivingEntity.class)
public interface LivingEntityAccessor {
    @Accessor("POTION_SWIRLS")
    static TrackedData<List<ParticleEffect>> predamage\$getPotionSwirls() {
        throw new AssertionError();
    }
}
"""
    }
}

tasks.named("compileJava").configure {
    dependsOn("generateLivingEntityAccessor")
}

tasks.withType(Jar).configureEach {
    if (name == "sourcesJar") {
        dependsOn("generateLivingEntityAccessor")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi "com.terraformersmc:modmenu:17.0.0-beta.2"
    modApi "dev.isxander:yet-another-config-lib:3.8.2+1.21.11-fabric"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
