buildscript {
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
            metadataSources {
                mavenPom()
                artifact()
                ignoreGradleMetadataRedirection()
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:1.16.2"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "b4_pre-damage_indicator" {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            runDir "run/${project.minecraft_version}"
            property "fabric.runtimeMappingNamespace", "named"
            property "fabric.defaultModDistributionNamespace", "named"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = false
    }
}

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.isxander.dev/releases" }
    maven { url "https://pkgs.dev.azure.com/isxander-dev/yet-another-config-lib/_maven/v2" }
    mavenCentral()
}

def generatedMixinSourceDir = layout.buildDirectory.dir("generated/sources/predamageMixin/java")
sourceSets.main.java.srcDir(generatedMixinSourceDir)

tasks.register("generateLivingEntityAccessor") {
    def outputFile = generatedMixinSourceDir.map {
        it.file("com/b4/predamage/mixin/LivingEntityAccessor.java")
    }

    inputs.property("minecraftVersion", project.minecraft_version)
    outputs.file(outputFile)

    doLast {
        def file = outputFile.get().asFile
        file.parentFile.mkdirs()
        file.text = """package com.b4.predamage.mixin;

import org.spongepowered.asm.mixin.Mixin;
import org.spongepowered.asm.mixin.gen.Accessor;

import java.util.List;
import net.minecraft.core.particles.ParticleOptions;
import net.minecraft.network.syncher.EntityDataAccessor;
import net.minecraft.world.entity.LivingEntity;

@Mixin(LivingEntity.class)
public interface LivingEntityAccessor {
    @Accessor("DATA_EFFECT_PARTICLES")
    static EntityDataAccessor<List<ParticleOptions>> predamage\$getPotionSwirls() {
        throw new AssertionError();
    }
}
"""
    }
}

tasks.named("compileJava").configure {
    dependsOn("generateLivingEntityAccessor")
}

tasks.withType(Jar).configureEach {
    if (name == "sourcesJar") {
        dependsOn("generateLivingEntityAccessor")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings files("mappings/identity-0.0.0.jar")
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modApi "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "minecraft_version_range", project.minecraft_version_range
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "minecraft_version_range": project.minecraft_version_range,
                "loader_version": project.loader_version
    }
}

tasks.named("generateDLIConfig").configure {
    doLast {
        def launchConfig = file(".gradle/loom-cache/launch.cfg")
        if (launchConfig.exists()) {
            def text = launchConfig.text
            text = text.replace(
                    "fabric.defaultModDistributionNamespace=official",
                    "fabric.defaultModDistributionNamespace=named"
            )
            if (!text.contains("fabric.runtimeMappingNamespace=")) {
                text = text.replace(
                        "\tfabric.development=true",
                        "\tfabric.development=true${System.lineSeparator()}\tfabric.runtimeMappingNamespace=named"
                )
            } else {
                text = text.replace(
                        "fabric.runtimeMappingNamespace=official",
                        "fabric.runtimeMappingNamespace=named"
                )
            }
            launchConfig.text = text
        }
    }
}

tasks.withType(JavaExec).configureEach {
    systemProperty "fabric.runtimeMappingNamespace", "named"
    systemProperty "fabric.defaultModDistributionNamespace", "named"
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE.txt") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
